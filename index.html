<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3f8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Apolaki</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top" id="top" hidden>
  <div class="brand">
    <span class="mark"><img src="icon.svg" alt="Apolaki" width="64" height="64"></span>
    <span>Apolaki</span>
  </div>
  <div class="top-right">
    <button id="syncBadge" class="sync" type="button" aria-label="Sync sales" hidden></button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="home" type="button"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
  <button data-tab="market" type="button"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Sell</button>
  <button data-tab="retailers" type="button"><svg viewBox="0 0 24 24"><path d="M3 9h18l-2-5H5zM4 9v11h16V9M9 20v-6h6v6"/></svg>Retailers</button>
  <button data-tab="stock" type="button"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>Stock</button>
  <button data-tab="accounts" type="button"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Accounts</button>
</nav>

<div id="sheet" class="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"><div class="page-bar"><button class="back" id="sheetBack" type="button"><svg viewBox="0 0 8 13"><path d="M6.5 1.5 1.5 6.5 6.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Back</button></div><div id="sheetBody"></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
